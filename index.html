<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitematicViewer</title>
    <script>
      // Apply a manually chosen theme before the first paint to avoid a flash
      // of the wrong theme. Same key as STORAGE_KEYS.THEME in
      // src/lib/constants/storage.ts. Automatic mode needs no attribute.
      try {
        var savedTheme = localStorage.getItem('lv:theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
